rules:
  - id: python-unused-import
    patterns:
      - pattern: |
          import $X
      - pattern-not: |
          $X
    message: "Unused import detected"
    languages: [python]
    severity: WARNING

  - id: bash-no-eval
    pattern: eval(...)
    message: "Avoid using eval in bash scripts"
    languages: [bash]
    severity: ERROR
